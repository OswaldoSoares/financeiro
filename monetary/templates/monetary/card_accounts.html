<!-- Header -->
<div class="card-header">
	<div class="div-flex">
		<i class="icofont-check pad-left"></i>
		<div class="div-form-control">
			<span>CONTAS ATIVAS</span>
		</div>
		<i class="icofont-simple-up i-button pad-right js-toggle-accounts"></i>
	</div>
</div>
<!-- Body -->
<div class="card-body body-accounts js-body-accounts">
	{% for account in accounts %}
	<div class="card-body-item">
		<div class="input-group">
			<div class="input-group-addon addon-my-color">
				<i class="i-button-null">{{ forloop.counter|stringformat:"02d" }}</i>
			</div>
		<div class="div-flex div-form-control">
			<div class="tamanho-60 text-left">
				<span title="{{ account.id }}">
					{{ account.name }}
				</span>
			</div>
			<div class="tamanho-30 text-right color-green">
				<span>R$ {{ account.balance }}</span>
			</div>
		</div>
		<div class="input-group-addon addon-my-color">
			<i class="icofont-eye-alt i-button js-mostra-itens"
				data-registry-id="{{ account.id }}"
				title="Consuta Itens"></i>
		</div>
	</div>
</div>
{% endfor %}
</div>
<!-- Footer -->
<div class="card-footer js-footer-registries-period">
	<div class="div-flex">
		<div class="div-form-control div-flex">
			<div class="tamanho-80 text-left">
				<span class="font-menor"></span>
			</div>
			<div class="tamanho-20 text-right">
				<span class="font-menor"></span>
			</div>
		</div>
	</div>
</div>
